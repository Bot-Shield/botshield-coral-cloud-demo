<template>
    <div class={rootClass} part="root">
        <!-- (1) The verify card — Figma 4242:4074, states/copy are the SDK's verbatim -->
        <button class="bs-btn" part="container" type="button" aria-live="polite" aria-label={ariaLabel}
                onclick={handleVerifyClick}>
            <span class="bs-main">
                <span class="bs-iconwrap"><span class="bs-icon" lwc:dom="manual"></span></span>
                <span class="bs-text">
                    <span class="bs-title">Verify you’re human</span>
                    <span class="bs-status">{statusText}</span>
                </span>
            </span>
            <span class="bs-lockup" part="branding">
                <span class="bs-wordmark" lwc:dom="manual"></span>
                <span class="bs-lockup-caption" aria-hidden="true">Privacy | Terms</span>
            </span>
        </button>

        <!-- (2) Component-owned, verified-gated checkout button (RFC 07) -->
        <template lwc:if={showCheckout}>
            <button class="bs-checkout-btn" part="checkout" type="button"
                    onclick={handleCheckoutClick} disabled={checkoutDisabled}>
                {checkoutLabel}
            </button>
            <template lwc:if={showConfirming}>
                <div class="bs-confirming" role="status">
                    <span class="bs-modal-pulse"></span>
                    <span>Recording your verification in Salesforce…</span>
                </div>
            </template>
        </template>

    </div>

    <!-- QR modal — the SDK's #bs-qr-modal-overlay, markup + copy verbatim.
         position:fixed inside the component; hosts must not put it under a
         transformed ancestor (coralCart's drawer slides via `right`, not
         transform, for exactly this reason). -->
    <template lwc:if={modalOpen}>
        <div class="bs-qr-modal-overlay" onclick={handleOverlayClick} role="dialog" aria-modal="true" aria-label="Verify with BotShield">
            <div class="bs-modal" onclick={stop}>
                <div class="bs-modal-body">
                    <div class="bs-modal-left">
                        <div class="bs-modal-logo">
                            <img src={logoUrl} alt="BotShield" />
                            <span>botShield</span>
                        </div>
                        <div class="bs-modal-stack">
                            <div class="bs-modal-badge">BotShield Human Verification</div>
                            <div class="bs-modal-title">{modalTitle}</div>
                            <div class="bs-modal-desc"><strong>{partnerDisplay}</strong> is asking BotShield to confirm you're human. BotShield never shares your identity — only a signal that you passed.</div>
                        </div>
                        <template lwc:if={showPushHint}>
                            <div class="bs-modal-push-hint">
                                <span class="bs-modal-push-dot"></span>
                                <span>We sent a prompt to your phone. Approve it there — or scan the code if it didn't arrive.</span>
                            </div>
                        </template>
                        <div class="bs-modal-steps">
                            <div class="bs-modal-step">
                                <div class="bs-modal-step-num">1</div>
                                <div><div class="bs-modal-step-title">Scan the QR code</div><div class="bs-modal-step-desc">Use your phone's camera to open the BotShield app</div></div>
                            </div>
                            <div class="bs-modal-step">
                                <div class="bs-modal-step-num">2</div>
                                <div><div class="bs-modal-step-title">Confirm with Face ID</div><div class="bs-modal-step-desc">One biometric check links this site to your BotShield ID</div></div>
                            </div>
                            <div class="bs-modal-step">
                                <div class="bs-modal-step-num">3</div>
                                <div><div class="bs-modal-step-title">Skip the QR next time</div><div class="bs-modal-step-desc">Future visits push a prompt straight to your phone</div></div>
                            </div>
                        </div>
                    </div>
                    <div class="bs-modal-right">
                        <div class="bs-modal-qr-wrap">
                            <img class="bs-modal-qr-img" src={qrUrl} alt="Scan QR code" />
                            <div>
                                <div class="bs-modal-qr-label">Scan to verify with BotShield</div>
                                <div class="bs-modal-qr-sub">Available on iOS and Android</div>
                            </div>
                            <div class="bs-modal-status">
                                <div class="bs-modal-pulse"></div>
                                <span class="bs-modal-status-text">Waiting for verification...</span>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="bs-modal-footer">
                    <div class="bs-modal-footer-text">
                        Powered by BotShield &bull; No data collected &bull;
                        <a href="https://botshield.ai/privacy" target="_blank" rel="noopener noreferrer">Privacy</a> &bull;
                        <a href="https://botshield.ai/terms" target="_blank" rel="noopener noreferrer">Terms</a>
                    </div>
                    <button class="bs-modal-cancel" type="button" onclick={handleCancel}>Cancel</button>
                </div>
            </div>
        </div>
    </template>
</template>
