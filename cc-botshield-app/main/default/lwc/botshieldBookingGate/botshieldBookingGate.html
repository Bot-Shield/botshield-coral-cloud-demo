<template>
    <section
        role="dialog"
        tabindex="-1"
        aria-modal="true"
        aria-label="Book this session"
        class="slds-modal slds-fade-in-open"
    >
        <div class="slds-modal__container">
            <header class="slds-modal__header bs-header">
                <button
                    class="slds-button slds-button_icon slds-modal__close"
                    title="Close"
                    onclick={handleClose}
                >
                    <lightning-icon
                        icon-name="utility:close"
                        size="small"
                        variant="inverse"
                    ></lightning-icon>
                    <span class="slds-assistive-text">Close</span>
                </button>
                <h1 class="slds-modal__title slds-hyphenate">
                    <span class="bs-shield">&#128737;&#65039;</span>
                    Book this session
                </h1>
                <p class="slds-m-top_x-small bs-subtitle">
                    Protected by BotShield — you confirm on your own device.
                </p>
            </header>

            <div class="slds-modal__content slds-var-p-around_medium">
                <!-- ── Form ─────────────────────────────────────────── -->
                <template lwc:if={isForm}>
                    <div class="slds-box slds-box_x-small slds-m-bottom_medium bs-summary">
                        <p><strong>{dateLabel}</strong> &middot; {sessionTimeLabel}</p>
                        <p lwc:if={priceLabel}>{priceLabel}</p>
                    </div>

                    <lightning-input
                        type="email"
                        label="Your BotShield account email"
                        field-level-help="The Q Card is sent to the BotShield app on your phone. No account yet? Download BotShield and enroll first."
                        value={email}
                        onchange={handleEmailChange}
                        required
                    ></lightning-input>

                    <lightning-input
                        type="number"
                        label="Number of guests"
                        min="1"
                        max="8"
                        value={guests}
                        onchange={handleGuestsChange}
                        class="slds-m-top_small"
                        required
                    ></lightning-input>

                    <p lwc:if={totalLabel} class="slds-m-top_small slds-text-heading_small">
                        Total: <strong>{totalLabel}</strong>
                    </p>

                    <p lwc:if={hasError} class="slds-m-top_small slds-text-color_error">
                        {errorMessage}
                    </p>
                </template>

                <!-- ── Waiting ──────────────────────────────────────── -->
                <template lwc:if={isWaiting}>
                    <div class="slds-align_absolute-center slds-m-vertical_medium bs-waiting">
                        <lightning-spinner
                            size="medium"
                            alternative-text="Waiting for confirmation"
                        ></lightning-spinner>
                    </div>
                    <h2 class="slds-text-heading_small slds-text-align_center">
                        A Q Card is waiting in your BotShield app
                    </h2>
                    <p class="slds-text-align_center slds-m-top_small">
                        Open <strong>BotShield</strong> on your phone and confirm
                        <strong>{experienceName}</strong> with Face&nbsp;ID.
                        This page updates on its own — nothing to do here.
                    </p>
                    <p lwc:if={hasError} class="slds-text-align_center slds-m-top_small slds-text-color_weak">
                        {errorMessage}
                    </p>
                </template>

                <!-- ── Confirmed ────────────────────────────────────── -->
                <template lwc:if={isApproved}>
                    <div class="slds-text-align_center slds-m-vertical_medium">
                        <lightning-icon
                            icon-name="utility:success"
                            variant="success"
                            size="large"
                        ></lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_small">
                            Booking confirmed
                        </h2>
                        <p class="slds-m-top_small">
                            <strong>{experienceName}</strong> &middot; {dateLabel}
                        </p>
                        <p lwc:if={bookingName} class="slds-m-top_x-small">
                            Booking number: <strong>{bookingName}</strong>
                        </p>
                        <p class="slds-m-top_small slds-text-color_weak">
                            Confirmed by you in the BotShield app, backed by a
                            signed Proof of Resolution.
                        </p>
                    </div>
                </template>

                <!-- ── Not happening ────────────────────────────────── -->
                <template lwc:if={isDenied}>
                    <div class="slds-text-align_center slds-m-vertical_medium">
                        <lightning-icon icon-name="utility:block_visitor" variant="error" size="large"></lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_small">Booking declined</h2>
                        <p class="slds-m-top_small">
                            This booking was declined in the BotShield app, so nothing was booked.
                        </p>
                    </div>
                </template>
                <template lwc:if={isExpired}>
                    <div class="slds-text-align_center slds-m-vertical_medium">
                        <lightning-icon icon-name="utility:clock" size="large"></lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_small">Confirmation expired</h2>
                        <p class="slds-m-top_small">
                            The Q Card timed out and nothing was booked. Start again whenever you're ready.
                        </p>
                    </div>
                </template>
                <template lwc:if={isCancelled}>
                    <div class="slds-text-align_center slds-m-vertical_medium">
                        <lightning-icon icon-name="utility:ban" size="large"></lightning-icon>
                        <h2 class="slds-text-heading_medium slds-m-top_small">Booking withdrawn</h2>
                        <p class="slds-m-top_small">The request was withdrawn and nothing was booked.</p>
                    </div>
                </template>
            </div>

            <footer class="slds-modal__footer">
                <template lwc:if={isForm}>
                    <button class="slds-button slds-button_neutral" onclick={handleClose}>
                        Cancel
                    </button>
                    <button
                        class="slds-button slds-button_brand"
                        onclick={handleSendClick}
                        disabled={isSending}
                    >
                        Send to my BotShield app
                    </button>
                </template>
                <template lwc:if={isWaiting}>
                    <button class="slds-button slds-button_neutral" onclick={handleCancelWaiting}>
                        Withdraw request
                    </button>
                </template>
                <template lwc:if={isTerminal}>
                    <button class="slds-button slds-button_brand" onclick={handleClose}>
                        Done
                    </button>
                </template>
            </footer>
        </div>
    </section>
    <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
</template>
